name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Anki.js is deliberately free of QML types, so the scheduler, the deck
      # parsing, the document merging and both file-I/O snippets all run under
      # plain node with no dependencies to install.
      #
      # The snippets are executed as real `sh`, which on this runner is dash
      # rather than the bash most desktops use — a useful second opinion on
      # whether they are actually POSIX.
      - name: Scheduler and file-handling tests
        run: node tests/scheduler.test.mjs

      # Card text is imported content and Qt's Text defaults to AutoText, which
      # interprets markup. These assert every sink forces plain text, so a Text
      # added later cannot quietly reintroduce it.
      - name: Rendering-safety tests
        run: node tests/rendering.test.mjs

      # The .apkg converter is standard-library Python. 3.14 is used because
      # its stdlib has zstd, which the newer package layout needs; the test
      # skips that case on older interpreters.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Anki package converter tests
        run: python3 tests/apkg.test.py

      # tests/soak.sh is deliberately not run here. It drives the real shell
      # with real keystrokes and needs a Wayland compositor, a running
      # omarchy-shell, and the keyboard focus of the machine it runs on. It
      # also edits the real deck and the real shell.json, restoring both on
      # every exit path. Every
      # bug this plugin has shipped was invisible to the suite above and caught
      # by that one, so a green badge here is not a claim that the surfaces
      # work — only that the rules underneath them do.
      - name: Note on the soak suite
        run: |
          echo "tests/soak.sh is not run in CI: it needs a live compositor and"
          echo "a running omarchy-shell. Run it locally after changing the save"
          echo "path, the surfaces, or the session lifecycle."
